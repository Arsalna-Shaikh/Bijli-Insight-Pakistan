services:
  - type: web
    name: bijli-insight-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # secrets: set in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
